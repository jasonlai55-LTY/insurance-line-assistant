services:
  - type: web
    name: insurance-assistant-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: USE_SQLITE
        value: "1"
      - key: PROJECT_NAME
        value: "Insurance LINE Assistant"
      - key: SECRET_KEY
        value: "insurance_line_assistant_secret_key_prod_2026"
